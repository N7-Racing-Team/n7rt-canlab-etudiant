[package]
name = "n7rt-can-lab"
description = "N7RT CAN Lab - application etudiant"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "n7rt_can_lab_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
n7rt-lab = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# "compression" (default) is left out: brotli at build time, no benefit for a local app.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
